format_version = 1

[config_groups]
Objective = "1-Plan Apo LmbdD0.80 20x"
System = "Startup"

[imaging]
every_t = 2
exposure = 200
save = true
binning = 1

    [imaging.config_groups]
    Laser-Intensity = "50%"
    LightPath = "Fluor"

[channels]
group = "Channel"
presets = ["ktr"]

[stimulation]
every_t = 1
exposure = 500
save = false

    [stimulation.config_groups]
    Channel = "DMD"
    LightPath = "DMD"
    Laser-Intensity = "AllOff"
    Sola = "30"

[segmentation.nuclei]
method = "cellpose"
model = "cpsam"

[segmentation.cells]
method = "cellpose"
model = "cpsam"

[pattern]
method = "ktr_clamp"
channel = "ktr"
target = 1.0
gain = 2.0
