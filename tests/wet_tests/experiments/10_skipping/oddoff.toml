System = "Startup"

[imaging]
every_t = 2
exposure = 50
save = true
binning = 1

    [imaging.config_groups]
    Laser-Intensity = "50%"
    LightPath = "Fluor"

[channels]
group = "Channel"
presets = ["545"]

[stimulation]
every_t = 1
exposure = 50
save = true

    [stimulation.config_groups]
    Channel = "DMD"
    LightPath = "DMD"
    Laser-Intensity = "AllOff"
    Sola = "30"

[pattern]
method = "odd_off"
