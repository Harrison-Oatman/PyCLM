[project]
name = "PyCLM"
version = "0.1.0"
description = "Closed-loop feedback control for optogenetic microscopy in Python"
readme = "README.md"
authors = [
    { name = "Harrison-Oatman", email = "ho6729@princeton.edu" }
]
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.14.0",
    "napari>=0.9.0",
    "natsort>=8.4.0",
    "notebook>=7.5.1",
    "opencv-python>=4.12.0.88",
    "pandas-stubs==2.3.2.250827",
    "pyarrow>=15",
    "pymmcore-plus>=0.14.0",
    "pymmcore-widgets>=0.10.1",
    "pymmcore>=11.2.1.71.0",
    "pyside6>=6.10.2",
    "pyyaml>=6.0.3",
    "scikit-image>=0.25.2",
    "tifffile>=2025.9.20",
    "toml>=0.10.2",
    "tomlkit>=0.13.2",
    "useq-schema>=0.9.2",
    "zarr>=3.0",
]

# The lab's microscope: pymmcore must speak the same Micro-Manager device
# interface as the installed device adapters. The Mightex Polygon DMD adapter
# is a closed vendor DLL built for interface 71, so uv.lock resolves to the
# last interface-71 stack (pymmcore 11.2.1.71.0 with the newest pymmcore-plus
# that actually runs on it; 0.15.0 declares support but fails on import).
# The version ranges above stay open: `pip install` elsewhere gets the current
# stack (interface 75, suite verified on pymmcore 12.5 / pymmcore-plus 0.18.1
# / pymmcore-widgets 0.12.1). To move this lock, delete these three lines and
# run `uv lock`. See docs/stage5b-interactivity-design.md, "Device interface".
[tool.uv]
constraint-dependencies = [
    "pymmcore==11.2.1.71.0",
    "pymmcore-plus==0.14.0",
    "pymmcore-widgets==0.10.1",
]

[project.optional-dependencies]
cellpose = [
    "cellpose>=4.0.6",
    "torch",
    "torchvision",
]

calibration = [
    "pycromanager>=1.0.2",
]

[dependency-groups]

analysis = [
    "laptrack>=0.17.0",
    "matplotlib>=3.10.6",
    "pandas>=2.3.2",
    "tqdm>=4.67.1",
    "statannotations>=0.7.2",
]

docs = [
    "matplotlib>=3.10.6",
    "myst-parser",
    "nox>=2025.2.9",
    "pytest>=8.4.2",
    "scipy>=1.15.0",
    "sphinx",
    "sphinx-rtd-theme",
]

dev = [
    { include-group = "analysis" },
    { include-group = "docs" },
]
test = [
    "pytest>=8.4.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff.lint]
select = [
  "B",
  "I",
  "RUF",
  "PT",
  "UP",
]

[project.scripts]
pyclm = "pyclm.__main__:main"
convert_hdf5s = "pyclm.convert_hdf5s:main"
gui = "pyclm.gui.gui_controller:main"


[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"
