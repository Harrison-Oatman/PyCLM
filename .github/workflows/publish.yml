name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      # a release is published only when its tag (v1.2.3), pyproject.toml's
      # version and a CHANGELOG.md section for it agree
      - name: Check the tag, the version and the changelog agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/check_release.py "$TAG"

      - name: Run the tests
        run: uv run --group test pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build wheel and sdist
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/closed-loop-microscopy
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
