name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: pre-commit/action@v3.0.1

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
    name: Check Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download uv
        uses: astral-sh/setup-uv@v6

      # PySide6 loads EGL/GL, xkbcommon, fontconfig and D-Bus even offscreen;
      # the runner image does not ship them
      - name: Install Qt system libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libx11-6

      - name: Test package
        run: uv run --group test pytest -rs
