# MicroManager Configuration Path
config_path = "C:\\Program Files\\Micro-Manager-2.0\\Ti2MightexCrestSolaSpectra_newlab.cfg"

# SLM Configuration
affine_transform = [[-0.29, -0.002, 939.891], [0.004, -0.579, 1505.235]]
slm_shape_h =  1140
slm_shape_w =  912

# Focus (Z) device selected at startup and settle time before each snap
focus_device = "ZDrive"
settle_time_seconds = 1.0

# Output format: "hdf5" (PyCLM format 1, one SWMR file per experiment) or
# "ome-zarr" (format 2, one OME-NGFF store per experiment; opens in Fiji/napari/zarr)
[output]
format = "hdf5"
pattern_policy = "on_change"   # DMD patterns stored: on_change | all | none (ome-zarr only)
export_imagej = true           # write ImageJ hyperstacks next to the data when the run ends
